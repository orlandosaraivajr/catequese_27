<section class="cor-{{ cor|default:'azul' }}">
    <div class="gc-topico">
        <h2>{{ titulo }}</h2>
    </div>

    {% if totais %}
    <div class="gc-tabela table-responsive">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>Turma / Horário</th>
                    <th class="text-end" style="width: 150px;">Total</th>
                </tr>
            </thead>
            <tbody>
                {% for item in totais %}
                <tr>
                    <td>{{ item.titulo }}</td>
                    <td class="text-end fw-medium">{{ item.quantidade }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="gc-vazio">
        <span class="material-symbols-outlined">inbox</span>
        Nenhuma inscrição em {{ titulo }}.
    </div>
    {% endif %}
</section>
