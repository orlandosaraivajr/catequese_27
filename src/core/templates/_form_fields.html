{% for field in form %}
    <div class="mb-4">
        {% if field.field.widget.input_type == 'checkbox' %}
            <div class="form-check">
                {{ field }}
                <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            </div>
        {% else %}
            <label for="{{ field.id_for_label }}" class="form-label{% if field.field.required %} campo-obrigatorio{% endif %}">
                {{ field.label }}
            </label>
            {{ field }}
        {% endif %}
        {% if field.help_text %}
            <div class="form-text">{{ field.help_text }}</div>
        {% endif %}
        {% for error in field.errors %}
            <div class="gc-erro-campo"><span class="material-symbols-outlined">error</span>{{ error }}</div>
        {% endfor %}
    </div>
{% endfor %}
