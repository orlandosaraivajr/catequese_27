<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro interno</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #fff; color: #3c4043; font-family: "Google Sans", "Roboto", "Segoe UI", Arial, sans-serif;
            text-align: center; padding: 1.5rem;
        }
        .icone {
            width: 96px; height: 96px; margin: 0 auto 1.5rem; border-radius: 50%;
            background: #e8f0fe; color: #1967d2; display: flex; align-items: center; justify-content: center;
        }
        .icone .material-symbols-outlined { font-size: 48px; }
        .codigo { color: #5f6368; font-size: .875rem; font-weight: 500; letter-spacing: .1em; margin: 0 0 .5rem; }
        h1 { color: #202124; font-weight: 400; font-size: 1.75rem; margin: 0 0 .75rem; }
        p { color: #5f6368; margin: 0 0 2rem; }
        a.btn {
            display: inline-block; padding: .55rem 1.5rem; border-radius: 20px; background: #1967d2; color: #fff;
            text-decoration: none; font-weight: 500;
        }
        a.btn:hover { background: #185abc; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
    </style>
</head>
<body>
    <main>
        <div class="icone"><span class="material-symbols-outlined">cloud_off</span></div>
        <p class="codigo">ERRO 500</p>
        <h1>Erro interno</h1>
        <p>Desculpe, ocorreu um erro inesperado em nosso servidor.</p>
        <a href="{% url 'core:index' %}" class="btn">Voltar ao início</a>
    </main>
</body>
</html>
